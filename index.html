<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061b36">
  <meta name="robots" content="noindex, nofollow">
  <title>Open Logic Number on Google Play</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#123c68 0%,#071b37 48%,#030b19 100%);color:#fff;text-align:center;padding:24px}
    main{width:min(100%,430px)}.mark{display:block;width:112px;height:112px;object-fit:cover;border-radius:25px;margin:0 auto 24px;box-shadow:0 0 32px #007bff55}
    h1{font-size:27px;margin:0 0 12px}p{color:#c5d9f0;line-height:1.6;margin:0 0 28px}a.button{display:block;background:#1689ff;color:#fff;text-decoration:none;font-weight:700;border-radius:15px;padding:18px 16px;box-shadow:0 8px 24px #007bff44}small{display:block;margin-top:22px;color:#9ab2ce;line-height:1.5}
  </style>
</head>
<body>
<main>
  <img class="mark" src="./logic-number-icon.png" alt="Logic Number game icon" width="112" height="112">
  <h1>Logic Number</h1>
  <p>Opening Google Play…</p>
  <a class="button" id="open" href="https://play.google.com/store/apps/details?id=com.logicnumber.logic_number_brain_puzzles">Open in Google Play</a>
  <small>If the store doesn't open automatically, tap the button above.</small>
</main>
<script>
(function(){
  'use strict';
  const id='com.logicnumber.logic_number_brain_puzzles';
  const web='https://play.google.com/store/apps/details?id='+id;
  const intent='intent://details?id='+id+'#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url='+encodeURIComponent(web)+';end';
  const android=/Android/i.test(navigator.userAgent);
  const button=document.getElementById('open');
  if(android){
    button.href=intent;
    // Attempt only once, and only after the page is loaded. Embedded browsers may block it.
    window.addEventListener('load',function(){
      if(document.visibilityState==='visible'){
        try{window.location.href=intent;}catch(e){}
      }
    },{once:true});
  } else {
    button.href=web;
    document.querySelector('p').textContent='Continue to Google Play';
  }
})();
</script>
</body>
</html>
